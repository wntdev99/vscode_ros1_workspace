name: ROS1

on:
  pull_request:
  push:
    branches:
      - noetic*
      - main
  workflow_dispatch:

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    container:
      image: osrf/ros:noetic-desktop-full
    steps:
      -
        name: Checkout code
        uses: actions/checkout@v6
      -
        name: Install dependencies
        run: |
          apt-get update
          apt-get install -y python3-catkin-tools python3-vcstool python3-rosdep
          rosdep update
      -
        name: Build
        run: |
          source /opt/ros/noetic/setup.bash
          catkin init
          catkin config --extend /opt/ros/noetic
          catkin build --no-status

  lint:
    name: ${{ matrix.linter }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        linter: [cppcheck, cpplint, flake8]
    steps:
      -
        name: Checkout code
        uses: actions/checkout@v6
      -
        name: Run linter
        uses: ./.github/actions/lint/
        env:
          LINTER: ${{ matrix.linter }}

  complete:
    name: Tests passed
    needs:
      - lint
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Check
        run: echo "Completed successfully!"
